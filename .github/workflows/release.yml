name: Release Xenon

on:
  push:
    tags:
      - "*.*.*"

jobs:
  build-and-test:
    name: Build and test tagged version
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Validate release tag
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use the MAJOR.MINOR.PATCH format, for example 0.1.0."
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Restore dependencies
        run: dotnet restore Xenon.sln

      - name: Build release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: dotnet build Xenon.sln --configuration Release --no-restore -p:XenonVersion="${VERSION}"

      - name: Run compiler tests
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: >-
          dotnet test tests/Xenon.Compiler.Tests/Xenon.Compiler.Tests.csproj
          --configuration Release
          --no-build
          --no-restore
          -p:XenonVersion="${VERSION}"

      - name: Run end-to-end tests
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: >-
          dotnet test tests/Xenon.EndToEnd.Tests/Xenon.EndToEnd.Tests.csproj
          --configuration Release
          --no-build
          --no-restore
          -p:XenonVersion="${VERSION}"

      - name: Run language server tests
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: >-
          dotnet test tests/Xenon.LanguageServer.Tests/Xenon.LanguageServer.Tests.csproj
          --configuration Release
          --no-build
          --no-restore
          -p:XenonVersion="${VERSION}"

      - name: Verify executable version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          cli_assembly="$(find out/Xenon.Cli/bin/Release -name xenon.dll -print -quit)"
          if [[ -z "${cli_assembly}" ]]; then
            echo "Could not find the built Xenon CLI assembly."
            exit 1
          fi

          actual="$(dotnet "${cli_assembly}" --version)"
          expected="xenon ${VERSION}"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "Expected '${expected}', got '${actual}'."
            exit 1
          fi

  package:
    name: Package ${{ matrix.rid }}
    needs: build-and-test
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-2022
            executable: xenon.exe
          - rid: win-arm64
            runner: windows-11-arm
            executable: xenon.exe
          - rid: osx-arm64
            runner: macos-15
            executable: xenon

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish Native AOT distribution
        env:
          RID: ${{ matrix.rid }}
          VERSION: ${{ needs.build-and-test.outputs.version }}
          PUBLISH_DIR: ${{ runner.temp }}/xenon-${{ needs.build-and-test.outputs.version }}-${{ matrix.rid }}
        shell: pwsh
        run: >-
          dotnet publish src/Xenon.Cli/Xenon.Cli.csproj
          --configuration Release
          --runtime $env:RID
          -p:XenonVersion=$env:VERSION
          --output $env:PUBLISH_DIR

      - name: Verify native distribution
        env:
          EXECUTABLE: ${{ matrix.executable }}
          VERSION: ${{ needs.build-and-test.outputs.version }}
          PUBLISH_DIR: ${{ runner.temp }}/xenon-${{ needs.build-and-test.outputs.version }}-${{ matrix.rid }}
        shell: pwsh
        run: |
          $actual = & (Join-Path $env:PUBLISH_DIR $env:EXECUTABLE) --version
          $expected = "xenon $env:VERSION"
          if ($LASTEXITCODE -ne 0 -or $actual -ne $expected) {
            throw "Expected '$expected', got '$actual'."
          }
          $managedAssemblies = @(Get-ChildItem -LiteralPath $env:PUBLISH_DIR -Recurse -Filter '*.dll' |
            Where-Object Name -ne 'libLLVM.dll')
          if ($managedAssemblies.Count -ne 0) {
            throw "Managed assemblies leaked into the Native AOT distribution: $($managedAssemblies.Name -join ', ')"
          }
          $smokeDirectory = Join-Path $env:RUNNER_TEMP 'xenon-compiler-smoke'
          New-Item -ItemType Directory -Force -Path $smokeDirectory | Out-Null
          Copy-Item -LiteralPath 'tests/Xenon.EndToEnd.Tests/Cases/Basics/Hello/main.xe' `
            -Destination $smokeDirectory
          & (Join-Path $env:PUBLISH_DIR $env:EXECUTABLE) run $smokeDirectory --release
          if ($LASTEXITCODE -ne 0) { throw 'Native compiler smoke test failed.' }

      - name: Remove debug symbols and create archive
        id: archive
        env:
          RID: ${{ matrix.rid }}
          VERSION: ${{ needs.build-and-test.outputs.version }}
          PUBLISH_DIR: ${{ runner.temp }}/xenon-${{ needs.build-and-test.outputs.version }}-${{ matrix.rid }}
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath $env:PUBLISH_DIR -Recurse |
            Where-Object { $_.Name -like '*.pdb' -or $_.Name -like '*.dbg' -or $_.Name -like '*.dSYM' } |
            Remove-Item -Recurse -Force
          $releaseDirectory = Join-Path $env:GITHUB_WORKSPACE 'release'
          New-Item -ItemType Directory -Force -Path $releaseDirectory | Out-Null
          if ($env:RID.StartsWith('win-')) {
            $archive = Join-Path $releaseDirectory "xenon-$env:VERSION-$env:RID.zip"
            Compress-Archive -Path (Join-Path $env:PUBLISH_DIR '*') -DestinationPath $archive
          }
          else {
            $archive = Join-Path $releaseDirectory "xenon-$env:VERSION-$env:RID.tar.gz"
            tar -C $env:PUBLISH_DIR -czf $archive .
            if ($LASTEXITCODE -ne 0) { throw 'tar failed.' }
          }
          "path=$archive" >> $env:GITHUB_OUTPUT

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: xenon-${{ needs.build-and-test.outputs.version }}-${{ matrix.rid }}
          path: ${{ steps.archive.outputs.path }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub release
    needs:
      - build-and-test
      - package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd release
          sha256sum xenon-* > SHA256SUMS

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build-and-test.outputs.version }}
        shell: bash
        run: |
          if gh release view "${VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${VERSION}" release/* \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "${VERSION}" release/* \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --generate-notes \
              --title "Xenon ${VERSION}"
          fi
