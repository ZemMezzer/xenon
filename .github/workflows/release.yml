name: Release Xenon

on:
  push:
    tags: ["*.*.*"]

jobs:
  validate-version:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate release tag
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use MAJOR.MINOR.PATCH, for example 0.1.0."
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  package:
    name: Package ${{ matrix.platform }}
    needs: validate-version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win_x86
            rid: win-x86
            runner: windows-2022
            executable: xenon.exe
          - platform: win_arm64
            rid: win-arm64
            runner: windows-11-arm
            executable: xenon.exe
          - platform: darwin_arm64
            rid: osx-arm64
            runner: macos-15
            executable: xenon

    steps:
      - name: Check out repository and LLVM
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: xenon/global.json

      - name: Build release on Windows
        if: runner.os == 'Windows'
        shell: cmd
        env:
          XENON_VERSION: ${{ needs.validate-version.outputs.version }}
        run: Build.bat ${{ matrix.platform }}

      - name: Build release on macOS
        if: runner.os == 'macOS'
        env:
          VERSION: ${{ needs.validate-version.outputs.version }}
        run: ./Build.sh ${{ matrix.platform }} -DXENON_VERSION="$VERSION"

      - name: Verify static NativeAOT distribution
        shell: pwsh
        env:
          PLATFORM: ${{ matrix.platform }}
          EXECUTABLE: ${{ matrix.executable }}
          VERSION: ${{ needs.validate-version.outputs.version }}
        run: |
          $publish = Join-Path $env:GITHUB_WORKSPACE "build/$env:PLATFORM/xenon/publish"
          $compiler = Join-Path $publish $env:EXECUTABLE
          $actual = & $compiler --version
          if ($LASTEXITCODE -ne 0 -or $actual -ne "xenon $env:VERSION") {
            throw "Expected 'xenon $env:VERSION', got '$actual'."
          }
          $forbidden = Get-ChildItem $publish -Recurse -File |
            Where-Object { $_.Name -match '^(LLVM-C|libLLVM).*\.(dll|dylib|so)$' -or $_.Extension -eq '.dll' }
          if ($forbidden) {
            throw "Dynamic or managed libraries leaked into NativeAOT publish: $($forbidden.Name -join ', ')"
          }
          $smoke = Join-Path $env:RUNNER_TEMP 'xenon-compiler-smoke'
          New-Item -ItemType Directory -Force -Path $smoke | Out-Null
          Copy-Item 'xenon/tests/Xenon.EndToEnd.Tests/Cases/Basics/Hello/main.xe' $smoke
          & $compiler run $smoke --release
          if ($LASTEXITCODE -ne 0) { throw 'Native compiler smoke test failed.' }

      - name: Run static LLVM C++ and cleanliness checks
        run: >-
          cmake --build build/${{ matrix.platform }}/cmake
          --config Release --target check

      - name: Create archive
        id: archive
        shell: pwsh
        env:
          PLATFORM: ${{ matrix.platform }}
          RID: ${{ matrix.rid }}
          VERSION: ${{ needs.validate-version.outputs.version }}
        run: |
          $publish = Join-Path $env:GITHUB_WORKSPACE "build/$env:PLATFORM/xenon/publish"
          $release = Join-Path $env:GITHUB_WORKSPACE 'release'
          New-Item -ItemType Directory -Force -Path $release | Out-Null
          Get-ChildItem $publish -Recurse |
            Where-Object { $_.Name -like '*.pdb' -or $_.Name -like '*.dbg' -or $_.Name -like '*.dSYM' } |
            Remove-Item -Recurse -Force
          if ($env:RID.StartsWith('win-')) {
            $archive = Join-Path $release "xenon-$env:VERSION-$env:RID.zip"
            Compress-Archive -Path (Join-Path $publish '*') -DestinationPath $archive
          } else {
            $archive = Join-Path $release "xenon-$env:VERSION-$env:RID.tar.gz"
            tar -C $publish -czf $archive .
            if ($LASTEXITCODE -ne 0) { throw 'tar failed.' }
          }
          "path=$archive" >> $env:GITHUB_OUTPUT

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: xenon-${{ needs.validate-version.outputs.version }}-${{ matrix.rid }}
          path: ${{ steps.archive.outputs.path }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub release
    needs: [validate-version, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Generate checksums
        run: cd release && sha256sum xenon-* > SHA256SUMS

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate-version.outputs.version }}
        shell: bash
        run: |
          if gh release view "${VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${VERSION}" release/* --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${VERSION}" release/* --repo "${GITHUB_REPOSITORY}" \
              --verify-tag --generate-notes --title "Xenon ${VERSION}"
          fi
