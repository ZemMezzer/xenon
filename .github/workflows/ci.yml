name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  managed:
    name: Managed and end-to-end tests
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: xenon/global.json

      - name: Check platform mapping and XML escaping
        run: cmake -P cmake/tests/BuildSystemChecks.cmake

      - name: Build and test moved solution
        run: dotnet test xenon/Xenon.sln --configuration Release

      - name: Reject source-local build artifacts
        shell: pwsh
        run: |
          $roots = 'xenon/src', 'xenon/tests', 'pipelines'
          $bad = Get-ChildItem $roots -Recurse -Force |
            Where-Object { $_.Name -in 'bin', 'obj', 'CMakeFiles', 'CMakeCache.txt' -or $_.Name -like '*.ninja' }
          if ($bad) { throw "Generated files leaked into source: $($bad.FullName -join ', ')" }

  native:
    name: Static LLVM + NativeAOT (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win_x64
            runner: windows-2022
            generator: Visual Studio 17 2022
          - platform: win_arm64
            runner: windows-11-vs2026-arm
            generator: Visual Studio 18 2026
          - platform: darwin_arm64
            runner: macos-15

    steps:
      - name: Check out repository and LLVM
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: xenon/global.json

      - name: Resolve pinned LLVM revision
        id: llvm-revision
        shell: pwsh
        run: |
          $revision = git -C llvm/llvm-project rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve the LLVM submodule revision.' }
          "revision=$revision" >> $env:GITHUB_OUTPUT

      - name: Restore LLVM build cache
        uses: actions/cache@v4
        with:
          path: build/${{ matrix.platform }}/llvm
          key: llvm-build-v2-${{ matrix.runner }}-${{ runner.arch }}-${{ matrix.platform }}-${{ steps.llvm-revision.outputs.revision }}-${{ hashFiles('Build.bat', 'Build.sh', 'CMakeLists.txt', 'pipelines/**/*.cmake', 'cmake/*.cmake') }}

      - name: Build on Windows
        if: runner.os == 'Windows'
        shell: cmd
        env:
          CMAKE_GENERATOR: ${{ matrix.generator }}
        run: Build.bat ${{ matrix.platform }}

      - name: Build on macOS
        if: runner.os == 'macOS'
        run: ./Build.sh ${{ matrix.platform }}

      - name: Run static-link and source-cleanliness checks
        run: >-
          cmake --build build/${{ matrix.platform }}/cmake
          --config Release --target check
