<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#070b11">
    <meta name="description" content="Xenon is a native compiled programming language built on LLVM.">
    <title>Xenon — Native by design</title>
    <link rel="icon" type="image/png" href="assets/logo.png">
    <link rel="apple-touch-icon" href="assets/logo.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="site-shell">
        <header class="site-header">
            <a class="brand" href="./" aria-label="Xenon home">
                <img src="assets/logo.png" alt="" width="36" height="22">
                <span>Xenon</span>
            </a>

            <nav aria-label="Main navigation">
                <a href="documentation/index.html">Documentation</a>
                <a href="https://github.com/ZemMezzer/xenon">GitHub</a>
            </nav>
        </header>

        <main>
            <section class="hero" aria-labelledby="hero-title">
                <div class="hero-content">
                    <p class="eyebrow">Native · Predictable · Explicit</p>
                    <h1 id="hero-title">
                        <img class="hero-wordmark" src="assets/lang-name.png" alt="Xenon" width="714" height="182">
                    </h1>
                    <p class="intro">
                        A native compiled language built on LLVM.<br>
                        Low-level control without legacy complexity.
                    </p>

                    <div class="hero-actions">
                        <a class="button button-primary" href="documentation/index.html">
                            Explore the language
                            <span aria-hidden="true">→</span>
                        </a>
                        <a class="button button-secondary" href="https://github.com/ZemMezzer/xenon">
                            View on GitHub
                        </a>
                    </div>
                </div>

                <div class="capabilities" aria-label="Xenon capabilities">
                    <div>
                        <span class="capability-index">01</span>
                        <strong>Native AOT</strong>
                    </div>
                    <div>
                        <span class="capability-index">02</span>
                        <strong>LLVM backend</strong>
                    </div>
                    <div>
                        <span class="capability-index">03</span>
                        <strong>Built-in C ABI</strong>
                    </div>
                </div>
            </section>
        </main>

        <footer>
            <span>Xenon language documentation</span>
        </footer>
    </div>
</body>
</html>
